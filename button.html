
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IntelliHome - Button Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            text-align: center;
            padding: 35px 15px;
        }

        h1 {
            margin: 5px 0;
        }

        .subtitle {
            color: #667085;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 50px;
        }

        button {
            padding: 13px 15px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .on {
            background: #16a34a;
            color: white;
        }

        .off {
            background: #dc2626;
            color: white;
        }

        .auto {
            background: #2563eb;
            color: white;
        }

        .status {
            margin-top: 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .onStatus {
            color: #16a34a;
        }

        .offStatus {
            color: #dc2626;
        }

        .small {
            font-size: 13px;
            color: #667085;
            margin-top: 10px;
        }

        .readings {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 22px;
        }

        .reading {
            background: white;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
        }

        .reading strong {
            display: block;
            font-size: 24px;
            margin-top: 8px;
        }

        #connectionStatus {
            text-align: center;
            margin-top: 25px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .back {
            display: block;
            width: 180px;
            margin: 35px auto;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            background: #172033;
            color: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎛️ IntelliHome Button Control</h1>
    <p class="subtitle">
        Control appliances manually or automatically
    </p>
</header>

<div class="container">

    <div class="grid">

        <!-- FAN -->
        <div class="card">
            <div class="icon">🌀</div>
            <h2>Fan</h2>

            <button class="on"
                onclick="manualCommand('V0', 1)">
                ON
            </button>

            <button class="off"
                onclick="manualCommand('V0', 0)">
                OFF
            </button>

            <div id="fanStatus" class="status">
                Fan: --
            </div>

            <button id="fanAutoButton"
                class="auto"
                onclick="toggleAuto('V5')">
                Enable Auto Fan
            </button>

            <div id="fanMode" class="small">
                Mode: checking...
            </div>
        </div>

        <!-- LED LAMP -->
        <div class="card">
            <div class="icon">💡</div>
            <h2>LED Lamp</h2>

            <button class="on"
                onclick="manualCommand('V1', 1)">
                ON
            </button>

            <button class="off"
                onclick="manualCommand('V1', 0)">
                OFF
            </button>

            <div id="ledStatus" class="status">
                LED: --
            </div>

            <button id="ledAutoButton"
                class="auto"
                onclick="toggleAuto('V6')">
                Enable Auto LED
            </button>

            <div id="ledMode" class="small">
                Mode: checking...
            </div>
        </div>

        <!-- LED STRIP -->
        <div class="card">
            <div class="icon">✨</div>
            <h2>LED Strip</h2>

            <button class="on"
                onclick="sendPin('V2', 1)">
                ON
            </button>

            <button class="off"
                onclick="sendPin('V2', 0)">
                OFF
            </button>

            <div id="stripStatus" class="status">
                LED Strip: --
            </div>

            <div class="small">
                Manual control
            </div>
        </div>

    </div>

    <!-- SENSOR READINGS -->
    <div class="readings">

        <div class="reading">
            Temperature
            <strong id="temperature">-- °C</strong>
        </div>

        <div class="reading">
            LDR Reading
            <strong id="lightValue">--</strong>

            <div id="roomCondition" class="small">
                Sensor reading
            </div>
        </div>

    </div>

    <div id="connectionStatus">
        Connecting to Blynk...
    </div>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</div>

<script>
    // Enter your NEW Blynk Auth Token here.
    // Do not publish this token on a public website.
    const BLYNK_TOKEN = "lJgZ3C-OWVYFNTLIOb_3wobsZzHyHsFF";

    const API = "https://blynk.cloud/external/api";

    const LDR_THRESHOLD = 2000;

    // Must match the Arduino setting.
    const DARK_READING_IS_HIGH = true;


    // BLYNK API REQUEST
    async function api(action, pin, value) {
        if (
            !BLYNK_TOKEN ||
            BLYNK_TOKEN === "PASTE_YOUR_NEW_BLYNK_AUTH_TOKEN_HERE"
        ) {
            throw new Error("Enter your Blynk Auth Token.");
        }

        let url =
            `${API}/${action}?token=` +
            encodeURIComponent(BLYNK_TOKEN) +
            `&${pin}`;

        if (value !== undefined) {
            url += `=${encodeURIComponent(value)}`;
        }

        let response;

        try {
            response = await fetch(url);
        } catch (error) {
            throw new Error(
                "Unable to connect to Blynk. Check your internet connection."
            );
        }

        const body = (await response.text()).trim();

        if (!response.ok) {
            console.error("Blynk API error:", {
                action,
                pin,
                value,
                status: response.status,
                response: body
            });

            throw new Error(
                `Blynk request failed: ${response.status} (${pin}): ` +
                (body || "Request rejected")
            );
        }

        return body;
    }


    // MANUAL APPLIANCE CONTROL
    // Manual fan/LED commands disable their respective automatic modes.
    async function manualCommand(pin, value) {
        try {
            if (pin === "V0") {
                await api("update", "V5", 0);
            }

            if (pin === "V1") {
                await api("update", "V6", 0);
            }

            await api("update", pin, value);

            document.getElementById("connectionStatus").textContent =
                "Manual command sent successfully.";

            await refreshStatus();

        } catch (error) {
            document.getElementById("connectionStatus").textContent =
                error.message;
        }
    }


    // LED STRIP CONTROL
    async function sendPin(pin, value) {
        try {
            await api("update", pin, value);

            document.getElementById("connectionStatus").textContent =
                "Command sent to Blynk.";

            await refreshStatus();

        } catch (error) {
            document.getElementById("connectionStatus").textContent =
                error.message;
        }
    }


    // ENABLE / DISABLE AUTOMATION
    // V5 = automatic fan; V6 = automatic LED.
    async function toggleAuto(pin) {
        const buttonId =
            pin === "V5" ? "fanAutoButton" : "ledAutoButton";

        const button = document.getElementById(buttonId);

        button.disabled = true;

        try {
            // Read the actual current mode from Blynk.
            const current = Number(await api("get", pin));

            if (current !== 0 && current !== 1) {
                throw new Error(
                    `Unexpected automation value for ${pin}: ${current}`
                );
            }

            // If ON, turn it OFF. If OFF, turn it ON.
            const nextValue = current === 1 ? 0 : 1;

            // Update the Blynk datastream.
            await api("update", pin, nextValue);

            const appliance = pin === "V5" ? "Fan" : "LED";

            document.getElementById("connectionStatus").textContent =
                nextValue === 1
                    ? `Automatic ${appliance} control enabled.`
                    : `Automatic ${appliance} control disabled.`;

            // Refresh mode labels and button text.
            await refreshStatus();

        } catch (error) {
            document.getElementById("connectionStatus").textContent =
                "Automation error: " + error.message;
        } finally {
            button.disabled = false;
        }
    }


    // DISPLAY APPLIANCE STATE
    function showState(id, label, value) {
        const element = document.getElementById(id);
        const isOn = Number(value) === 1;

        element.textContent =
            `${label}: ${isOn ? "ON" : "OFF"}`;

        element.className =
            "status " + (isOn ? "onStatus" : "offStatus");
    }


    // READ CURRENT STATES FROM BLYNK
    async function refreshStatus() {
        try {
            const [
                fan,
                led,
                strip,
                temp,
                light,
                fanAuto,
                ledAuto
            ] = await Promise.all([
                api("get", "V0"),
                api("get", "V1"),
                api("get", "V2"),
                api("get", "V3"),
                api("get", "V4"),
                api("get", "V5"),
                api("get", "V6")
            ]);

            showState("fanStatus", "Fan", fan);
            showState("ledStatus", "LED", led);
            showState("stripStatus", "LED Strip", strip);

            // Temperature display
            const tempNumber = Number(temp);

            document.getElementById("temperature").textContent =
                temp !== "" && Number.isFinite(tempNumber)
                    ? `${tempNumber.toFixed(1)} °C`
                    : "-- °C";

            // LDR display
            const lightNumber = Number(light);

            document.getElementById("lightValue").textContent =
                light !== "" && Number.isFinite(lightNumber)
                    ? String(lightNumber)
                    : "--";

            if (
                light !== "" &&
                Number.isFinite(lightNumber)
            ) {
                const isDark = DARK_READING_IS_HIGH
                    ? lightNumber >= LDR_THRESHOLD
                    : lightNumber <= LDR_THRESHOLD;

                document.getElementById("roomCondition").textContent =
                    isDark
                        ? "Dark (threshold-based)"
                        : "Bright (threshold-based)";
            }

            // Update automatic mode displays.
            const isFanAuto = Number(fanAuto) === 1;
            const isLedAuto = Number(ledAuto) === 1;

            document.getElementById("fanMode").textContent =
                "Mode: " +
                (isFanAuto ? "Automatic" : "Manual");

            document.getElementById("ledMode").textContent =
                "Mode: " +
                (isLedAuto ? "Automatic" : "Manual");

            // Button labels show the NEXT action.
            document.getElementById("fanAutoButton").textContent =
                isFanAuto
                    ? "Disable Auto Fan"
                    : "Enable Auto Fan";

            document.getElementById("ledAutoButton").textContent =
                isLedAuto
                    ? "Disable Auto LED"
                    : "Enable Auto LED";

            document.getElementById("connectionStatus").textContent =
                "Connected to Blynk.";

        } catch (error) {
            document.getElementById("connectionStatus").textContent =
                "Unable to read Blynk: " + error.message;
        }
    }


    // INITIALIZE AND REFRESH
    refreshStatus();

    // Keep appliance and automation displays synchronized.
    setInterval(refreshStatus, 2500);
</script>

</body>
</html>
