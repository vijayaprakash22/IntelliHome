<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IntelliHome - Button Control</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f7fb;

            color: #172033;

        }


        header {

            text-align: center;

            padding: 35px 15px;

        }


        header h1 {

            margin: 5px 0;

        }


        .subtitle {

            color: #667085;

        }


        .container {

            width: 90%;

            max-width: 1000px;

            margin: auto;

        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 22px;

        }


        .card {

            background: white;

            border-radius: 20px;

            padding: 30px;

            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

        }


        .icon {

            font-size: 50px;

        }


        h2 {

            margin: 12px 0 20px;

        }


        button {

            width: 42%;

            padding: 13px 10px;

            margin: 5px;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .on {

            background: #16a34a;

            color: white;

        }


        .off {

            background: #dc2626;

            color: white;

        }


        .status {

            margin-top: 18px;

            font-size: 18px;

            font-weight: bold;

        }


        .status.onStatus {

            color: #16a34a;

        }


        .status.offStatus {

            color: #dc2626;

        }


        .connection {

            text-align: center;

            margin-top: 25px;

            font-weight: bold;

        }


        .back {

            display: block;

            width: 180px;

            margin: 35px auto;

            padding: 12px;

            text-align: center;

            text-decoration: none;

            background: #172033;

            color: white;

            border-radius: 10px;

        }

    </style>

</head>


<body>


<header>

    <h1>
        🎛️ IntelliHome Button Control
    </h1>

    <div class="subtitle">
        Control your appliances manually
    </div>

</header>



<div class="container">


    <div class="grid">


        <!-- ================= FAN ================= -->

        <div class="card">

            <div class="icon">
                🌀
            </div>

            <h2>
                Fan
            </h2>


            <button
                class="on"
                onclick="setDevice('V0', 1)">

                ON

            </button>


            <button
                class="off"
                onclick="setDevice('V0', 0)">

                OFF

            </button>


            <div
                id="fanStatus"
                class="status offStatus">

                🔴 Fan: OFF

            </div>

        </div>



        <!-- ================= LED ================= -->

        <div class="card">

            <div class="icon">
                💡
            </div>

            <h2>
                LED
            </h2>


            <button
                class="on"
                onclick="setDevice('V1', 1)">

                ON

            </button>


            <button
                class="off"
                onclick="setDevice('V1', 0)">

                OFF

            </button>


            <div
                id="ledStatus"
                class="status offStatus">

                🔴 LED: OFF

            </div>

        </div>



        <!-- ================= LED STRIP ================= -->

        <div class="card">

            <div class="icon">
                ✨
            </div>

            <h2>
                LED Strip
            </h2>


            <button
                class="on"
                onclick="setDevice('V2', 1)">

                ON

            </button>


            <button
                class="off"
                onclick="setDevice('V2', 0)">

                OFF

            </button>


            <div
                id="stripStatus"
                class="status offStatus">

                🔴 Strip: OFF

            </div>

        </div>


    </div>


    <div
        id="connectionStatus"
        class="connection">

        Connecting to Blynk...

    </div>


    <a
        class="back"
        href="index.html">

        ← Back to Home

    </a>


</div>



<script>


// =====================================================
// BLYNK AUTH TOKEN
// =====================================================

// Replace ONLY this value with your Blynk Auth Token.
//
// IMPORTANT:
// Do not publish your real token on a public GitHub
// repository.

const BLYNK_TOKEN =
    "lJgZ3C-OWVYFNTLIOb_3wobsZzHyHsFF";



// =====================================================
// SEND COMMAND TO BLYNK
// =====================================================

function setDevice(pin, value) {


    if (
        BLYNK_TOKEN ===
        "PASTE_YOUR_BLYNK_AUTH_TOKEN_HERE"
    ) {

        alert(
            "Please enter your Blynk Auth Token."
        );

        return;

    }



    const url =

        "https://blynk.cloud/external/api/update" +

        "?token=" +

        encodeURIComponent(BLYNK_TOKEN) +

        "&" +

        pin +

        "=" +

        value;



    fetch(url)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Blynk command failed"
                );

            }

            updateStatus(
                pin,
                value
            );

        })

        .catch(error => {

            console.error(error);

            document.getElementById(
                "connectionStatus"
            ).innerText =
                "❌ Unable to send command to Blynk";

        });

}



// =====================================================
// GET CURRENT VALUE FROM BLYNK
// =====================================================

function getDeviceStatus() {


    if (
        BLYNK_TOKEN ===
        "PASTE_YOUR_BLYNK_AUTH_TOKEN_HERE"
    ) {

        document.getElementById(
            "connectionStatus"
        ).innerText =
            "⚠️ Blynk Auth Token required";

        return;

    }



    // -------------------------
    // FAN - V0
    // -------------------------

    fetch(
        "https://blynk.cloud/external/api/get" +
        "?token=" +
        encodeURIComponent(BLYNK_TOKEN) +
        "&V0"
    )

    .then(response => response.text())

    .then(value => {

        updateStatus(
            "V0",
            Number(value)
        );

    })

    .catch(error => {

        console.error(error);

    });



    // -------------------------
    // LED - V1
    // -------------------------

    fetch(
        "https://blynk.cloud/external/api/get" +
        "?token=" +
        encodeURIComponent(BLYNK_TOKEN) +
        "&V1"
    )

    .then(response => response.text())

    .then(value => {

        updateStatus(
            "V1",
            Number(value)
        );

    })

    .catch(error => {

        console.error(error);

    });



    // -------------------------
    // LED STRIP - V2
    // -------------------------

    fetch(
        "https://blynk.cloud/external/api/get" +
        "?token=" +
        encodeURIComponent(BLYNK_TOKEN) +
        "&V2"
    )

    .then(response => response.text())

    .then(value => {

        updateStatus(
            "V2",
            Number(value)
        );

    })

    .catch(error => {

        console.error(error);

    });



    document.getElementById(
        "connectionStatus"
    ).innerText =
        "🟢 Connected to Blynk";

}



// =====================================================
// UPDATE DISPLAYED STATUS
// =====================================================

function updateStatus(pin, value) {


    // -------------------------
    // FAN
    // -------------------------

    if (pin === "V0") {

        const element =
            document.getElementById(
                "fanStatus"
            );


        if (Number(value) === 1) {

            element.innerText =
                "🟢 Fan: ON";

            element.className =
                "status onStatus";

        }

        else {

            element.innerText =
                "🔴 Fan: OFF";

            element.className =
                "status offStatus";

        }

    }



    // -------------------------
    // LED
    // -------------------------

    if (pin === "V1") {

        const element =
            document.getElementById(
                "ledStatus"
            );


        if (Number(value) === 1) {

            element.innerText =
                "🟢 LED: ON";

            element.className =
                "status onStatus";

        }

        else {

            element.innerText =
                "🔴 LED: OFF";

            element.className =
                "status offStatus";

        }

    }



    // -------------------------
    // LED STRIP
    // -------------------------

    if (pin === "V2") {

        const element =
            document.getElementById(
                "stripStatus"
            );


        if (Number(value) === 1) {

            element.innerText =
                "🟢 Strip: ON";

            element.className =
                "status onStatus";

        }

        else {

            element.innerText =
                "🔴 Strip: OFF";

            element.className =
                "status offStatus";

        }

    }

}



// =====================================================
// CHECK BLYNK STATUS
// =====================================================

// Read the current status immediately
getDeviceStatus();


// Read again every 2 seconds.
//
// This is what allows button.html to notice
// changes made from voice.html or Blynk dashboard.

setInterval(
    getDeviceStatus,
    2000
);


</script>


</body>

</html>
