<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IntelliHome</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #eef5ff,
                #f8fbff
            );

            color: #172033;
        }

        .container {
            width: 90%;
            max-width: 900px;

            text-align: center;

            padding: 40px 20px;
        }

        .logo {
            font-size: 65px;
        }

        h1 {
            font-size: 45px;
            margin: 10px 0;
        }

        .subtitle {
            font-size: 20px;
            color: #667085;

            margin-bottom: 45px;
        }

        .options {
            display: flex;

            gap: 25px;

            justify-content: center;

            flex-wrap: wrap;
        }

        .card {
            width: 330px;

            background: white;

            padding: 32px 25px;

            border-radius: 22px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.10);

            cursor: pointer;

            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .icon {
            font-size: 55px;
        }

        h2 {
            margin: 15px 0 10px;
        }

        .card p {
            color: #667085;

            line-height: 1.5;

            min-height: 48px;
        }

        button {
            border: none;

            border-radius: 12px;

            padding: 13px 22px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background: #172033;

            color: white;
        }

        .footer {
            margin-top: 40px;

            color: #98a2b3;

            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="logo">
        🏠
    </div>


    <h1>
        IntelliHome
    </h1>


    <div class="subtitle">
        Intelligent Home Automation System
    </div>


    <div class="options">


        <!-- BUTTON CONTROL -->

        <div class="card"
             onclick="location.href='button.html'">

            <div class="icon">
                🎛️
            </div>

            <h2>
                Control with Buttons
            </h2>

            <p>
                Control your fan, LED and LED strip
                using simple ON/OFF buttons.
            </p>

            <button>
                Open Button Control
            </button>

        </div>



        <!-- VOICE CONTROL -->

        <div class="card"
             onclick="location.href='voice.html'">

            <div class="icon">
                🎤
            </div>

            <h2>
                Control with Voice
            </h2>

            <p>
                Control appliances using voice
                commands and smart scene modes.
            </p>

            <button>
                Open Voice Control
            </button>

        </div>


    </div>


    <div class="footer">

        ESP32 • Blynk IoT • Smart Home Automation

    </div>


</div>


</body>

</html>
